<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Submissions (demo) | Ennavizion</title>
  <link rel="icon" href="assets/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Big+Shoulders+Display:wght@700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="admin">
<main id="main">
  <section class="page-hero on-dark"><div class="wrap">
    <h1>Submissions</h1>
    <p>Demo mode only: shows forms sent from this browser while <code>formEndpoint</code> in js/data.js is empty. Once you add an endpoint, submissions go to your email instead and this page stays empty.</p>
  </div></section>
  <section class="section"><div class="wrap">
    <div class="section-head" style="margin-bottom:1rem">
      <p id="count" class="muted"></p>
      <div style="display:flex;gap:.5rem">
        <button class="btn btn-green btn-sm" id="export" type="button">Download CSV</button>
        <button class="btn btn-line btn-sm" id="clear" type="button">Delete all</button>
      </div>
    </div>
    <div class="table-scroll"><table class="admin-table" id="subs"></table></div>
  </div></section>
</main>
<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  const KEY = "ennavizion_submissions";
  const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; } };
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  function draw() {
    const rows = load().slice().reverse();
    document.getElementById("count").textContent = rows.length ? rows.length + " submissions" : "No submissions yet. Send a test from the Contact or Enrol page.";
    document.getElementById("subs").innerHTML = rows.length ? "<thead><tr><th>Received</th><th>Type</th><th>Details</th></tr></thead><tbody>" +
      rows.map(r => `<tr><td>${new Date(r._submitted).toLocaleString()}</td><td>${esc(r._type)}</td><td>${Object.entries(r).filter(([k]) => !k.startsWith("_")).map(([k, v]) => `<strong>${esc(k)}:</strong> ${esc(v)}`).join("<br>")}</td></tr>`).join("") + "</tbody>" : "";
  }
  document.getElementById("export").addEventListener("click", () => {
    const rows = load(); if (!rows.length) return;
    const keys = [...new Set(rows.flatMap(Object.keys))];
    const csv = [keys.join(","), ...rows.map(r => keys.map(k => `"${String(r[k] ?? "").replace(/"/g, '""')}"`).join(","))].join("\n");
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" })); a.download = "ennavizion-submissions.csv"; a.click();
  });
  document.getElementById("clear").addEventListener("click", () => { if (confirm("Delete all stored submissions from this browser?")) { localStorage.removeItem(KEY); draw(); } });
  draw();
});
</script>
</body>
</html>
